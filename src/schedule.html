<title>皮膚管理課程表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: a "today" card up top, then one card per class day grouped by week; consecutive periods of the same subject merge into one block. */
:root{
  --bg:#f3f6f6; --paper:#ffffff; --fg:#1b2a2d; --muted:#5a6b6f; --line:#d3dfe0;
  --accent:#17736f; --accent-soft:#d9eeec; --mark:#b8475d; --mark-soft:#f8e3e7; --off:#eef1f1;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a1c; --paper:#182326; --fg:#e2ebeb; --muted:#9db0b3; --line:#2b3b3e;
  --accent:#5fc6c0; --accent-soft:#1b3b3a; --mark:#f08ca0; --mark-soft:#3b2229; --off:#141f21;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111a1c; --paper:#182326; --fg:#e2ebeb; --muted:#9db0b3; --line:#2b3b3e;
  --accent:#5fc6c0; --accent-soft:#1b3b3a; --mark:#f08ca0; --mark-soft:#3b2229; --off:#141f21;
  color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:960px;margin:0 auto}
header{padding-block:40px 20px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:16px;font-size:14px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.25;margin:.4em 0 .2em;text-wrap:balance}
h2{font-family:var(--serif);font-weight:900;font-size:22px;margin:32px 0 12px}
.sub{color:var(--muted);margin:0;max-width:62ch}

.now{margin-top:20px;background:var(--paper);border:1px solid var(--accent);border-radius:12px;padding:16px}
.now .lbl{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.now .big{font-family:var(--serif);font-size:22px;font-weight:900;margin:2px 0}

.progress{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.pg-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pg-head b{font-size:15px}
.pg-head .pct{font-family:var(--serif);font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent)}
.pg-head .pct.all{color:var(--mark)}
.pg-track{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden;margin-top:4px}
.pg-fill{height:100%;border-radius:5px;background:var(--accent);transition:width .6s}
.pg-fill.all{background:var(--mark)}
.pg-note{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.filters button{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--fg);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}

.week{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:28px 0 8px}
.day{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;scroll-margin-top:12px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day.past{opacity:.6}
.day.off{background:var(--off)}
.date b{display:block;font-family:var(--serif);font-size:20px;line-height:1.2}
.date span{font-size:13px;color:var(--muted)}
.date .tag{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--accent)}
.blocks{display:grid;gap:6px;min-width:0}
.blk{display:grid;grid-template-columns:116px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;background:var(--accent-soft)}
.blk.dim{opacity:.35}
.blk .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.blk .s{font-weight:700}
.blk .who{font-size:14px;color:var(--muted);white-space:nowrap}
.blk.live{background:var(--mark-soft);outline:2px solid var(--mark)}
.offtxt{color:var(--muted);padding:6px 0}
@media (max-width:600px){
  .day{grid-template-columns:minmax(0,1fr)}
  .date b,.date span,.date .tag{display:inline;margin-right:6px}
  .blk{grid-template-columns:minmax(0,1fr) auto}
  .blk .t{grid-column:1 / -1}
}

table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--accent);margin-top:4px}
.scans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.scans a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);color:var(--muted);font-size:13px;text-decoration:none}
.scans img{display:block;width:100%;height:auto}
.scans span{display:block;padding:6px 10px}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
<div class="wrap">
<header>
  <nav class="crumbs"><a href="../">← 講義</a><a href="../quiz/">測驗</a><a href="../notes/">我的疑問</a></nav>
  <h1 id="title"></h1>
  <p class="sub" id="org"></p>
  <div class="now" id="now"></div>
  <div class="progress" id="progress" aria-live="polite"></div>
  <div class="filters" id="filters" role="group" aria-label="依老師篩選"></div>
</header>

<main id="days"></main>

<h2>各課目時數</h2>
<table id="totals"><thead><tr><th>課目</th><th>老師</th><th style="text-align:right">節數</th></tr></thead><tbody></tbody></table>

<h2>原始課表</h2>
<div class="scans">
  <a href="scans/115-10.jpg"><img src="scans/115-10.jpg" alt="10 月課表掃描檔" loading="lazy"><span>115/10/07 – 10/30</span></a>
  <a href="scans/115-11.jpg"><img src="scans/115-11.jpg" alt="11 月課表掃描檔" loading="lazy"><span>115/11/02 – 11/24</span></a>
</div>

<footer>進度條依現在時間計算已經上過的課堂分鐘數；術科指 <span id="pr"></span>，其餘（理論、法規、職場通識）都算學科。<br>資料來源：<code>data/schedule.json</code>，依原始課表整理。原表第 7 節印成「16:30–16:20」，這裡依前後節推為 15:30–16:20。</footer>
</div>
<script>
const S = {{DATA}};
const P = Object.fromEntries(S.periods.map(p => [p.n, p]));
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const now = new Date();
const todayISO = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
const span = b => `${P[b.from].start}–${P[b.to].end}`;
const periods = b => b.to - b.from + 1;
const md = d => d.roc.slice(4);
let teacher = null;

$('title').textContent = S.title;
$('org').textContent = S.org;
document.title = S.title;

// Today / next class card.
(function () {
  const today = S.days.find(d => d.date === todayISO);
  const next = S.days.find(d => d.date > todayISO && d.blocks.length);
  const el = $('now');
  if (today && today.blocks.length) {
    const live = today.blocks.find(b => P[b.from].start <= hhmm && hhmm < P[b.to].end);
    const up = today.blocks.find(b => P[b.from].start > hhmm);
    const b = live || up;
    el.innerHTML = b
      ? `<div class="lbl">${live ? '現在' : '今天接下來'}</div><div class="big">${b.subject}</div>${span(b)}・${b.teacher}`
      : `<div class="lbl">今天</div><div class="big">今天的課上完了</div>` +
        (next ? `下次上課 ${md(next)}（${next.weekday}）${next.blocks[0].subject}` : '');
  } else if (next) {
    el.innerHTML = `<div class="lbl">${today ? `今天${today.off}` : '下次上課'}</div>` +
      `<div class="big">${md(next)}（${next.weekday}）${next.blocks[0].subject}</div>${span(next.blocks[0])}・${next.blocks[0].teacher}`;
  } else if (todayISO > S.days[S.days.length - 1].date) {
    el.innerHTML = `<div class="lbl">結訓</div><div class="big">課程已全部結束</div>`;
  } else el.remove();
})();

// Teacher filter chips.
const teachers = [...new Set(S.days.flatMap(d => d.blocks.map(b => b.teacher)))];
function chips() {
  $('filters').innerHTML = ['全部', ...teachers].map(t =>
    `<button type="button" data-t="${t}" aria-pressed="${(t === '全部' ? null : t) === teacher}">${t}</button>`).join('');
}
$('filters').addEventListener('click', e => {
  const t = e.target.closest('button')?.dataset.t;
  if (!t) return;
  teacher = t === '全部' ? null : t;
  chips(); render();
});

// Monday of the date's week, used to group days.
function weekKey(iso) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function render() {
  let html = '', wk = null, n = 0;
  for (const d of S.days) {
    const k = weekKey(d.date);
    if (k !== wk) { wk = k; n++; html += `<div class="week">第 ${n} 週・${k} 起</div>`; }
    const cls = ['day', d.date === todayISO && 'today', d.date < todayISO && 'past', d.off && 'off'].filter(Boolean).join(' ');
    const total = d.blocks.reduce((a, b) => a + periods(b), 0);
    const tag = d.date === todayISO ? '<span class="tag">今天</span>' : '';
    const body = d.off ? `<div class="offtxt">${d.off}</div>` : d.blocks.map(b => {
      const live = d.date === todayISO && P[b.from].start <= hhmm && hhmm < P[b.to].end;
      const dim = teacher && b.teacher !== teacher;
      return `<div class="blk${live ? ' live' : ''}${dim ? ' dim' : ''}"><span class="t">${span(b)}・${periods(b)} 節</span>` +
        `<span class="s">${b.subject}</span><span class="who">${b.teacher}</span></div>`;
    }).join('');
    html += `<section class="${cls}" id="d${d.date}"><div class="date"><b>${md(d)}</b><span>週${d.weekday}${total ? `・${total} 節` : ''}</span>${tag}</div>` +
      `<div class="blocks">${body}</div></section>`;
  }
  $('days').innerHTML = html;
}

// Progress bars: share of class minutes already elapsed, per category. Updated every 30 s.
const PRACTICAL = new Set(S.practical);
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function progress() {
  const t = new Date();
  const iso = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
  const mins = t.getHours() * 60 + t.getMinutes() + t.getSeconds() / 60;
  const acc = { 學科: [0, 0, 0, 0], 術科: [0, 0, 0, 0] }; // [done minutes, total minutes, done periods, total periods]
  for (const d of S.days) for (const b of d.blocks) {
    const a = acc[PRACTICAL.has(b.subject) ? '術科' : '學科'];
    for (let n = b.from; n <= b.to; n++) {
      const s = toMin(P[n].start), e = toMin(P[n].end);
      const done = d.date < iso ? e - s : d.date > iso ? 0 : Math.min(Math.max(mins - s, 0), e - s);
      a[0] += done; a[1] += e - s; a[2] += done === e - s; a[3]++;
    }
  }
  const all = [0, 1, 2, 3].map(i => acc.學科[i] + acc.術科[i]);
  const row = (name, a, cls = '') => {
    const pct = a[0] / a[1] * 100;
    return `<div><div class="pg-head"><b>${name}</b><span class="pct ${cls}">${pct.toFixed(1)}%</span></div>` +
      `<div class="pg-track" role="progressbar" aria-label="${name}進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct.toFixed(1)}">` +
      `<div class="pg-fill ${cls}" style="width:${pct}%"></div></div>` +
      `<div class="pg-note">已上 ${a[2]} / ${a[3]} 節</div></div>`;
  };
  $('progress').innerHTML = row('學科', acc.學科) + row('術科', acc.術科) + row('全部', all, 'all');
}
progress();
setInterval(progress, 30000);

// Hours per subject.
(function () {
  const m = new Map();
  for (const d of S.days) for (const b of d.blocks) {
    const r = m.get(b.subject) || { teacher: b.teacher, n: 0 };
    r.n += periods(b); m.set(b.subject, r);
  }
  const rows = [...m].sort((a, b) => b[1].n - a[1].n);
  const max = rows[0][1].n, sum = rows.reduce((a, r) => a + r[1].n, 0);
  $('totals').tBodies[0].innerHTML = rows.map(([s, r]) =>
    `<tr><td>${s}<div class="bar" style="width:${r.n / max * 100}%"></div></td><td>${r.teacher}</td><td class="n">${r.n}</td></tr>`).join('') +
    `<tr><td><b>合計</b></td><td></td><td class="n"><b>${sum}</b></td></tr>`;
})();

$('pr').textContent = S.practical.join('、');
chips(); render();
document.getElementById('d' + todayISO)?.scrollIntoView({ block: 'start' });
</script>
