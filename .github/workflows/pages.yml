name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build
        run: python3 tools/build.py
      - name: Collect site
        run: |
          mkdir -p _site/quiz _site/notes _site/schedule
          cp index.html _site/index.html
          cp quiz/index.html _site/quiz/index.html
          cp notes/index.html _site/notes/index.html
          cp schedule/index.html _site/schedule/index.html
          cp -R schedule/scans _site/schedule/scans
          cp -R game _site/game
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
